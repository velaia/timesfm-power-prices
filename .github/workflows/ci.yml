name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test (offline, no model download)
        run: uv run pytest -q
